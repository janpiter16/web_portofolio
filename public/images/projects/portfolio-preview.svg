  <text x="658" y="354" font-family="monospace" font-size="9.5" font-weight="700" fill="#10B981">"UNTUNG"</text>
  <text x="592" y="374" font-family="monospace" font-size="10" fill="#94A3B8">}</text>

  <rect x="592" y="394" width="138" height="40" rx="8" fill="#111C35" stroke="#2C67ED"/>
